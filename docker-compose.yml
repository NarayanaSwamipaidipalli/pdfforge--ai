services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pdfforge-postgres
    restart: always
    environment:
      POSTGRES_USER: pdfforge
      POSTGRES_PASSWORD: pdfforge_secure_pass_2026
      POSTGRES_DB: pdfforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfforge -d pdfforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cluster Broker & Caching
  redis:
    image: redis:7.2-alpine
    container_name: pdfforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Local Storage
  minio:
    image: elestio/minio:latest
    container_name: pdfforge-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Ollama On-Premise Air-Gapped Private LLM Sidecar (Optional profile)
  ollama:
    profiles: ["onprem-llm"]
    image: ollama/ollama:latest
    container_name: pdfforge-ollama-sidecar
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  # NestJS API Gateway & Core Control Plane
  api-gateway:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pdfforge-api-gateway
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://pdfforge:pdfforge_secure_pass_2026@postgres:5432/pdfforge_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: pdfforge-documents
      PDF_WORKER_URL: http://pdf-worker:8000
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: pdfforge-enterprise-jwt-super-secret-key-2026
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Python PDF Worker Engine (FastAPI & Synchronous Jobs)
  pdf-worker:
    build:
      context: ./services/pdf-worker
      dockerfile: Dockerfile
    container_name: pdfforge-pdf-worker
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: pdfforge-documents
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # Celery Async Distributed Processing Worker
  celery-worker:
    build:
      context: ./services/pdf-worker
      dockerfile: Dockerfile
    container_name: pdfforge-celery-worker
    restart: always
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=10
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: pdfforge-documents
    depends_on:
      - redis
      - pdf-worker

  # Next.js 15 Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pdfforge-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_models:
