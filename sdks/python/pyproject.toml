[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfforge"
version = "1.0.0"
authors = [
  { name="PDFForge AI Architecture Team", email="engineering@pdfforge.ai" },
]
description = "Official Python SDK for PDFForge AI Enterprise Platform"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://pdfforge.ai"
"Documentation" = "https://docs.pdfforge.ai"
"Repository" = "https://github.com/pdfforge-ai/pdfforge-python"
