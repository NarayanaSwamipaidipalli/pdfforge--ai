name: Doxera security and integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application tests, builds and npm audit
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      LOAD_LOCAL_ENV: 'false'
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API dependencies and generate client (no database connection)
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma generate
      - name: API regression tests and build
        working-directory: apps/api
        run: |
          npm test -- --runInBand
          npm run build
          npm audit --audit-level=high
      - name: Frontend build and audit
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm audit --audit-level=high
      - name: Proxy, redirect and Compose helper regressions
        run: node --test scripts/remediation/proxy.test.mjs scripts/remediation/safe-redirect.test.mjs scripts/docker/prepare-env.test.mjs

  isolated-integration:
    name: Real Docker, PostgreSQL, billing and conversion checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run with synthetic credentials and fresh resources only
        run: node scripts/remediation/ci.mjs
      - name: Upload only non-secret test summaries and synthetic conversion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-verification
          if-no-files-found: ignore
          path: |
            .remediation/auth-results.txt
            .remediation/billing-results.txt
            .remediation/migration-results-*.json
            .remediation/worker-audit.json
            .remediation/*-registry-audit.json
            .remediation/render-validation.txt
            .remediation/pipeline-*/pdf-validation.json
            .remediation/pipeline-*/performance-results.json
            .remediation/pipeline-*/backup-results.json
            .remediation/pipeline-*/web-runtime-results.txt
            .remediation/pipeline-*/pipeline-result.pdf
            .remediation/pipeline-*/pipeline-result.png
          retention-days: 7
